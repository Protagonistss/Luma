[package]
name = "tauri-plugin-player"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
links = "tauri-plugin-player"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
