[package]
name = "luma"
version = "0.0.1"
description = "Luma Android TV live player"
authors = ["Protagonistss"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "luma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-player = { path = "plugins/player" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream"
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
url = "2"
axum = "0.8"
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
